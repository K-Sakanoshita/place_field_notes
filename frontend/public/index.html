<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まちの記録帖 / Place Field Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.3.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.3.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
</head>
<body>
<header class="site-header">
  <div><a class="brand" href="/"><strong data-i18n="app_name">まちの記録帖</strong><span data-i18n="app_subtitle">Place Field Notes</span></a></div>
  <label class="language-picker"><span data-i18n="language">言語</span><select id="language-select"><option value="ja">日本語</option><option value="en">English</option></select></label>
</header>
<main id="app" class="page-shell">
  <div id="global-status" class="status" hidden></div>
  <section id="editor-view" hidden>
    <div class="section-heading"><div><p class="eyebrow" id="editor-kicker" data-i18n="create_project">作品を作る</p><h1 id="editor-title" data-i18n="create_project">作品を作る</h1></div></div>
    <form id="project-form" class="card form-grid">
      <label class="field span-2"><span data-i18n="title_label">タイトル</span><input name="title" maxlength="255" required></label>
      <label class="field span-2"><span data-i18n="description_label">説明</span><textarea name="description" rows="4"></textarea></label>
      <label class="field"><span data-i18n="activity_type">活動タイプ</span><select name="activity_type" id="activity-type"><option value="osm" data-i18n="activity_osm">OpenStreetMap mapping</option><option value="wikipedia" data-i18n="activity_wikipedia">Wikipedia Town</option><option value="mixed" data-i18n="activity_mixed">OpenStreetMap + Wikipedia Town</option><option value="other" data-i18n="activity_other">Other / Mixed</option></select></label><div></div>
      <label class="field"><span data-i18n="start_label">開始日時</span><input type="datetime-local" name="start_at" required></label>
      <label class="field"><span data-i18n="end_label">終了日時</span><input type="datetime-local" name="end_at" required></label>
      <div class="span-2"><div class="field-label" data-i18n="area">対象範囲</div><div class="map-actions"><button type="button" id="select-bbox" class="secondary" data-i18n="select_bbox">地図上で範囲を選択</button><span id="bbox-text" class="muted" data-i18n="select_bbox_help">矩形の対角2点をクリック</span></div><div id="editor-map" class="map"></div></div>
      <div id="fixed-range-note" class="span-2 note" hidden data-i18n="fixed_activity_range"></div>
      <div class="span-2 action-row" id="preview-row"><button type="button" id="preview-diff" data-i18n="preview_diff">OSM差分を確認</button></div>
    </form>
    <section id="diff-section" class="card" hidden><div class="section-heading"><h2 data-i18n="diff_preview">OSM差分プレビュー</h2><span id="base-map-label" class="chip"></span></div><div id="diff-map" class="map map-large"></div><div id="diff-summary"></div><h3 data-i18n="linked_candidates">成果候補</h3><div id="candidate-list" class="stack"></div></section>
    <section class="card"><div class="section-heading"><h2 data-i18n="field_notes">活動記録</h2><button type="button" class="secondary" id="add-entry" data-i18n="add_entry">記録を追加</button></div><div id="entry-list" class="stack"></div></section>
    <section class="card"><div class="section-heading"><h2 data-i18n="place_results">成果地点</h2><button type="button" class="secondary" id="add-place" data-i18n="add_place">成果地点を追加</button></div><div id="place-list" class="stack"></div></section>
    <section id="photo-editor" class="card" hidden>
      <div class="section-heading"><h2 data-i18n="photos">写真</h2></div>
      <form id="photo-form" class="form-grid compact">
        <label class="field"><span data-i18n="source_type">種別</span><select name="source_type" id="photo-source-type"><option value="upload" data-i18n="photo_upload">ローカル画像</option><option value="commons" data-i18n="photo_commons">Wikimedia Commons</option><option value="url" data-i18n="photo_url">一般URL</option></select></label>
        <label class="field photo-source upload"><span data-i18n="choose_files">画像ファイル</span><input type="file" name="files" accept="image/jpeg,image/png,image/webp" multiple></label>
        <label class="field photo-source commons" hidden><span data-i18n="commons_file">Commons File名</span><input name="commons_file" placeholder="File:Example.jpg"></label>
        <label class="field photo-source url" hidden><span data-i18n="source_url">URL</span><input type="url" name="source_url"></label>
        <label class="field"><span data-i18n="caption">キャプション</span><input name="caption"></label><label class="field"><span data-i18n="creator">作者 / 撮影者</span><input name="creator"></label><label class="field"><span data-i18n="credit">クレジット</span><input name="credit"></label>
        <label class="field"><span data-i18n="license">ライセンス</span><select name="license"><option>CC BY 4.0</option><option>CC BY-SA 4.0</option><option>CC0 1.0</option></select></label>
        <label class="field"><span data-i18n="latitude">緯度</span><input name="lat" type="number" step="any"></label><label class="field"><span data-i18n="longitude">経度</span><input name="lon" type="number" step="any"></label>
        <label class="field"><span data-i18n="associate_entry">活動記録に関連付け</span><select name="entry_id" id="photo-entry"><option value="" data-i18n="none">なし</option></select></label><label class="field"><span data-i18n="associate_place">成果地点に関連付け</span><select name="place_result_id" id="photo-place"><option value="" data-i18n="none">なし</option></select></label><label class="field"><span data-i18n="associate_feature">OSM成果候補に関連付け</span><select name="featured_object_id" id="photo-feature"><option value="" data-i18n="none">なし</option></select></label>
        <div class="span-2"><button type="submit" data-i18n="upload_photo">写真を追加</button></div>
      </form><div id="photo-list" class="photo-grid"></div>
    </section>
    <div class="sticky-save"><button id="save-project" type="button" data-i18n="save_project">作品を保存</button></div><section id="saved-links" class="card success-card" hidden></section>
  </section>
  <section id="public-view" hidden>
    <div class="hero card"><p class="eyebrow" data-i18n="app_name">まちの記録帖</p><h1 id="public-title"></h1><p id="public-description" class="lead"></p><div id="public-meta" class="meta-row"></div></div>
    <section class="card"><div class="section-heading"><h2 data-i18n="project_area">対象エリア</h2><span id="public-base-map" class="chip"></span></div><div id="public-map" class="map map-large"></div></section>
    <section class="card"><h2 data-i18n="summary">主な変更点</h2><div id="public-summary"></div></section><section id="public-featured-section" class="card"><h2 data-i18n="osm_results">OpenStreetMapの成果</h2><div id="public-featured" class="stack"></div></section><section id="public-places-section" class="card"><h2 data-i18n="wikimedia_results">Wikimedia等の成果</h2><div id="public-result-summary"></div><div id="public-places" class="stack"></div></section><section id="public-entries-section" class="card"><h2 data-i18n="field_notes">活動記録</h2><div id="public-entries" class="stack"></div></section><section id="public-photos-section" class="card"><h2 data-i18n="photos">写真</h2><div id="public-photos" class="photo-grid"></div></section>
  </section>
</main>
<script src="/i18n.js"></script><script src="/api.js"></script><script src="/map.js"></script><script src="/main.js"></script><script src="/media.js"></script>
</body></html>
