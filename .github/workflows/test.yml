name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-env-docker.sh
          node --check frontend/public/api.js
          node --check frontend/public/i18n.js
          node --check frontend/public/map.js
          node --check frontend/public/main.js
          node --check frontend/public/media.js
          node --check frontend/public/enhancements.js
          node --check frontend/public/place-details.js
          node --check frontend/public/photo-exif.js
          python3 - <<'PY'
          import json
          import pathlib
          import re

          dictionaries = {}
          for lang in ('ja', 'en'):
              path = pathlib.Path(f'frontend/public/i18n/{lang}.json')
              dictionaries[lang] = json.loads(path.read_text(encoding='utf-8'))

          used = set()
          for path in pathlib.Path('frontend/public').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              used.update(re.findall(r"i18n\.t\(\s*['\"]([^'\"]+)['\"]", text))

          html = pathlib.Path('frontend/public/index.html').read_text(encoding='utf-8')
          used.update(re.findall(r'data-i18n(?:-placeholder)?="([^"]+)"', html))

          for lang, dictionary in dictionaries.items():
              missing = sorted(used - set(dictionary))
              if missing:
                  raise SystemExit(f'{lang} i18n keys missing: {missing}')

          if set(dictionaries['ja']) != set(dictionaries['en']):
              only_ja = sorted(set(dictionaries['ja']) - set(dictionaries['en']))
              only_en = sorted(set(dictionaries['en']) - set(dictionaries['ja']))
              raise SystemExit(f'i18n dictionaries differ: only_ja={only_ja}, only_en={only_en}')
          PY

      - name: Start MySQL test environment
        run: ./scripts/test-env-docker.sh start

      - name: Run API and MySQL smoke tests
        run: ./scripts/test-env-docker.sh test

      - name: Show logs on failure
        if: failure()
        run: docker compose --project-name place-field-notes-test --file docker/local/compose.yml logs --no-color --tail=200

      - name: Stop test environment
        if: always()
        run: ./scripts/test-env-docker.sh stop
